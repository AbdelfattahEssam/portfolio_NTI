<section class="section" id="experience">
  <div class="container">
    <h2>Work Experience</h2>

    @for (job of experiences(); track job._id) {
      <div class="job">
        <h3>{{ job.company }}</h3>
        <div class="job-meta">
          <h4>{{ job.position }}</h4>
          <span>{{ job.startDate }} — {{ job.endDate }}</span>
        </div>
        <ul class="checklist">
          @for (point of job.summary; track $index) {
            <li>{{ point }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
