<section class="section">
  <div class="container">
    <h2>Dashboard</h2>

    <h3 class="subtitle">{{ editingId() ? 'Edit Project' : 'Add Project' }}</h3>

    <form #projectForm="ngForm" (ngSubmit)="saveProject(projectForm)" class="form">
      <label>
        Name
        <input type="text" name="name" ngModel required #name="ngModel" />
        @if (name.invalid && name.touched) {
          <small class="error">Name is required</small>
        }
      </label>

      <label>
        Summary
        <textarea name="summary" rows="3" ngModel required #summary="ngModel"></textarea>
        @if (summary.invalid && summary.touched) {
          <small class="error">Summary is required</small>
        }
      </label>

      <label>
        GitHub link
        <input type="text" name="linkSource" ngModel />
      </label>

      <label>
        Postman link
        <input type="text" name="linkPreview" ngModel />
      </label>

      <div class="form-actions">
        <button type="submit" class="btn-add" [disabled]="projectForm.invalid">
          {{ editingId() ? 'Save Changes' : 'Add Project' }}
        </button>
        @if (editingId()) {
          <button type="button" class="btn-cancel" (click)="cancelEdit(projectForm)">Cancel</button>
        }
      </div>
    </form>

    <h3 class="subtitle">Projects</h3>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (project of projects(); track project._id) {
          <tr>
            <td>{{ project.name }}</td>
            <td class="actions">
              <button class="btn-edit" (click)="startEdit(project, projectForm)">Edit</button>
              <button class="btn-delete" (click)="deleteProject(project._id)">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2">No projects yet.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
